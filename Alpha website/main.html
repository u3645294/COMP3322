<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Pantry Chef</title>
        
        <link rel="stylesheet" href="main_style.css">
        
        <script src="recipes.js" defer></script>
        <script src="main_script.js" defer></script>
    
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">
    </head>
    <body>
        <div class="app">
            <aside class="sidebar">
                <h2 class="sidebar-title">My Pantry</h2>

                <form id="ingredient-form" class="ingredient-form">
                    <div class="form-row">
                        <label for="ingredient-category">Category</label>
                        <select id="ingredient-category" required>
                            <option value="" disabled selected>Select a category…</option>
                            <option value="Sauces &amp; Condiments">Sauces &amp; Condiments</option>
                            <option value="Vegetables &amp; Fruits">Vegetables &amp; Fruits</option>
                            <option value="Meat &amp; Seafood">Meat &amp; Seafood</option>
                            <option value="Dairy &amp; Eggs">Dairy &amp; Eggs</option>
                            <option value="Dry Goods &amp; Spices">Dry Goods &amp; Spices</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <label for="ingredient-search">Ingredient</label>
                        <div class="combo" id="ingredient-combo">
                            <input
                                type="text"
                                id="ingredient-search"
                                placeholder="Search ingredient…"
                                autocomplete="off"
                                disabled
                            >
                            <input type="hidden" id="ingredient-name" name="ingredient">
                            <ul id="ingredient-options" class="combo-options hidden"></ul>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="ingredient-amount">Amount</label>
                        <div class="amount-row">
                            <input
                                type="number"
                                id="ingredient-amount"
                                min="0"
                                step="any"
                                placeholder="500"
                                required
                            >
                            <select id="ingredient-unit">
                                <option value="g">g</option>
                                <option value="ml">mL</option>
                                <option value="pcs" selected>pcs</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary">Add Ingredient</button>
                    
                </form>

                <div class="pantry-list-wrapper" id="pantry-lists">
                    <!-- Lists are generated by JS, one per category -->
                </div>
            </aside>

            <main class="main-content">
                <div class="avaliable-dishes">
                    <h2>Available Dishes</h2>
                    <div class="dishes-grid" id="dishes-container">
                        <!-- Dishes are generated by JS -->
                    </div>
                </div>
                <div class="recommended-dishes">
                    <h2>Recommended Dishes</h2>
                    <div class="dishes-grid" id="recommended-dishes-container">
                        <!-- Recommended dishes are generated by JS -->
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
