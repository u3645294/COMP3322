<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Pantry Chef</title>

        <link rel="stylesheet" href="../css/main_style.css">
        <link rel="stylesheet" href="../css/navbar.css">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

        <script src="../js/config.js" defer></script>
        <script src="../js/api.js" defer></script>
        <script src="../js/ui.js" defer></script>
        <script src="../js/main_script.js" defer></script>
        <script src="../js/navbar.js" defer></script>
        <link rel="stylesheet" href="../css/api-ui.css">
    </head>
    <body>
        <p id="page-status" class="api-status" role="status" aria-live="polite"></p>
        <nav class="topnav">
            <a href="main.html" class="nav-brand">Pantry Chef</a>

            <ul class="nav-tabs">
                <li><a href="main.html"><span class="label">Pantry</span></a></li>
                <li><a href="explore.html"><span class="label">Explore</span></a></li>
                <li><a href="favourites.html"><span class="label">Favourites</span></a></li>
                <li><a href="history.html"><span class="label">History</span></a></li>
            </ul>

            <div class="nav-user">
                <button class="user-btn" type="button" aria-haspopup="true" aria-expanded="false">
                    <span class="user-avatar">G</span>
                    <span class="user-name">Guest</span>
                    <span class="user-caret">▾</span>
                </button>

                <ul class="user-menu">
                    <li><a href="explore.html#preferences">Preferences</a></li>
                    <li class="logout">
                        <button class="logout-btn" type="button">
                            Log out
                        </button>
                    </li>
                </ul>
            </div>
        </nav>
        <div class="app">
            <aside class="sidebar">
                <h2 class="sidebar-title">My Pantry</h2>

                <form id="ingredient-form" class="ingredient-form">

                    <div class="form-row">
                        <label for="ingredient-search">Ingredient</label>
                        <div class="combo" id="ingredient-combo">
                            <input
                                type="text"
                                id="ingredient-search"
                                placeholder="Search ingredient…"
                                autocomplete="off" maxlength="50" required
                            >
                            <input type="hidden" id="ingredient-name" name="ingredient">
                            <ul id="ingredient-options" class="combo-options hidden"></ul>
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="ingredient-amount">Amount</label>
                        <div class="amount-row">
                            <input
                                type="number"
                                id="ingredient-amount"
                                min="0.01"
                                step="any"
                                placeholder="500"
                                required
                            >
                            <select id="ingredient-unit"><option value="piece">piece</option><option value="g">g</option><option value="kg">kg</option><option value="ml">ml</option><option value="l">l</option><option value="tsp">tsp</option><option value="tbsp">tbsp</option><option value="cup">cup</option><option value="can">can</option><option value="pack">pack</option></select>
                        </div>
                    </div>

                    <div class="form-row"><label for="ingredient-expiry">Expiry (optional)</label><input type="date" id="ingredient-expiry"></div>
                    <button type="button" id="cancel-edit" hidden>Cancel edit</button>
                    <button type="submit" class="btn-primary">Add Ingredient</button>

                </form>

                <div class="pantry-list-wrapper" id="pantry-lists">
                    <!-- Lists are generated by JS, one per category -->
                </div>
            </aside>

            <main class="main-content">
                <button type="button" class="btn-primary" id="refresh-matches">Refresh suggestions</button> <a href="explore.html#match-form">Matching preferences</a>
                <div class="avaliable-dishes">
                    <h2>Available Dishes</h2>
                    <div class="dishes-grid" id="dishes-container">
                        <!-- Dishes are generated by JS -->
                    </div>
                </div>
                <div class="recommended-dishes">
                    <h2>Recommended Dishes</h2>
                    <div class="dishes-grid" id="recommended-dishes-container">
                        <!-- Recommended dishes are generated by JS -->
                    </div>
                </div>
            </main>
        </div>
    </body>
</html>
